# .project metadata for SDC
# Documentation: https://github.com/cncf/automation/tree/main/utilities/dot-project
#
# Instructions:
#   1. Replace all [PLACEHOLDER] values with your project's information
#   2. Remove any optional sections you don't need
#   3. Ensure your project validates: see the CI workflow in .github/workflows/

schema_version: "1.0.0"
slug: "sdc"
name: "SDC (Schema Driven Configuration)"
description: "Declarative, schema-driven API automation that delivers seamless, idempotent system configuration across diverse interface standards."
type: "project"
project_lead: "CsatariGergely"   # Optional: single lead — plain string
# project_lead:                  # Optional: multiple leads — list form
#   - "github-handle"
#   - "org/team-name"
slack_channels:                 # Optional: one or more CNCF Slack channels
  - name: "#my-project"         # REQUIRED per entry: must start with "#"
    workspace: "cncf"           # Optional: Slack workspace identifier
    link: "https://cloud-native.slack.com/messages/my-project" # Optional: channel/invite URL
    primary: true               # Optional: mark the main channel for end-users

maturity_log:                   # REQUIRED: at least one entry
  - phase: "sandbox"            # sandbox, incubating, graduated, archived
    date: "2026-09-09T00:00:00Z"
    issue: "https://github.com/cncf/sandbox/issues/429"

repositories:                   # REQUIRED: at least one repository URL
  - "https://github.com/sdcio/data-server"
  - "https://github.com/sdcio/config-server"
  - "https://github.com/sdcio/schema-server"
  - "https://github.com/sdcio/integration-tests"
  - "https://github.com/sdcio/yang-parser"
  - "https://github.com/sdcio/sdc-protos"
  - "https://github.com/sdcio/yang-standard"
  - "https://github.com/sdcio/sdctl"
  - "https://github.com/sdcio/kubectl-sdc"
  - "https://github.com/sdcio/sdc-lite"
  - "https://github.com/sdcio/docs"
  - "https://github.com/sdcio/cache"
  - "https://github.com/sdcio/sonic-schema"
  - "https://github.com/sdcio/goyang"
  - "https://github.com/sdcio/intent-builder"
  - "https://github.com/sdcio/logger"

website: "https://docs.sdcio.dev/"
artwork: "https://github.com/cncf/artwork/tree/master/projects/sdc"

adopters:                      # Optional: link to adopters list
  path: "https://github.com/sdcio/docs/blob/main/ADOPTERS.md"

